name: CI
on:
  push:
    branches:
    - main
  pull_request:
    branches:
    - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Java 25
      uses: actions/setup-java@v5
      with:
        distribution: temurin
        java-version: '25'
        cache: maven
    - name: Build and test
      run: mvn --batch-mode clean verify
